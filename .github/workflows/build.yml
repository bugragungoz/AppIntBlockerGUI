name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build AppIntBlockerGUI.sln -c Release

      # Includes firewall.ps1 run in Windows PowerShell 5.1 and PowerShell 7 against stand-in
      # cmdlets, so the runner's firewall is never touched.
      - name: Test
        run: dotnet test AppIntBlockerGUI.sln -c Release --no-build

      - name: Publish
        run: dotnet publish src/AppIntBlockerGUI/AppIntBlockerGUI.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: AppIntBlockerGUI-win-x64
          path: publish

  # Pushing a version tag (v2.0.0) publishes a release with the build as a zip and the version's
  # CHANGELOG section as its notes. A release already made on GitHub for the tag gets the zip added.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: AppIntBlockerGUI-win-x64
          path: publish

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $zip = "AppIntBlockerGUI-$env:TAG-win-x64.zip"
          Compress-Archive -Path publish/* -DestinationPath $zip
          $version = $env:TAG.TrimStart('v')
          $changelog = Get-Content CHANGELOG.md -Raw
          $notes = [regex]::Match($changelog, "(?ms)^## $([regex]::Escape($version))\b[^\n]*\n(.*?)(?=^## |\z)").Groups[1].Value.Trim()
          Set-Content -Path notes.md -Value $notes -Encoding utf8
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
              gh release upload $env:TAG $zip --clobber --repo $env:GITHUB_REPOSITORY
          } else {
              gh release create $env:TAG $zip --title "AppIntBlockerGUI $env:TAG" --notes-file notes.md --repo $env:GITHUB_REPOSITORY
          }
