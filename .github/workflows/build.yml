name: Build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build AppIntBlockerGUI.sln -c Release

      # Includes firewall.ps1 run in Windows PowerShell 5.1 and PowerShell 7 against stand-in
      # cmdlets, so the runner's firewall is never touched.
      - name: Test
        run: dotnet test AppIntBlockerGUI.sln -c Release --no-build

      - name: Publish
        run: dotnet publish src/AppIntBlockerGUI/AppIntBlockerGUI.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: AppIntBlockerGUI-win-x64
          path: publish

  # A push to master whose project version (<Version> in AppIntBlockerGUI.csproj) has no release
  # yet publishes one: tag v<version> on that commit, the build as a zip, and the version's
  # CHANGELOG section as the notes. To release, raise the version and push.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: AppIntBlockerGUI-win-x64
          path: publish

      - name: Publish the release if this version has none
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = ([xml](Get-Content src/AppIntBlockerGUI/AppIntBlockerGUI.csproj -Raw)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
              Write-Output "$tag is already released."
              exit 0
          }
          $zip = "AppIntBlockerGUI-$tag-win-x64.zip"
          Compress-Archive -Path publish/* -DestinationPath $zip
          $changelog = Get-Content CHANGELOG.md -Raw
          $notes = [regex]::Match($changelog, "(?ms)^## $([regex]::Escape($version))\b[^\n]*\n(.*?)(?=^## |\z)").Groups[1].Value.Trim()
          Set-Content -Path notes.md -Value $notes -Encoding utf8
          gh release create $tag $zip --target $env:GITHUB_SHA --title "AppIntBlockerGUI $tag" --notes-file notes.md --repo $env:GITHUB_REPOSITORY
